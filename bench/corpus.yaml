# Corpus A — real repositories, pinned by commit.
#
# Fixtures and mutants measure the detectors against code shaped for them. This measures
# them against code that was never written with this tool in mind, which is the only place
# the real false-positive rate shows up. Nothing here is vendored: `bench/corpus.py` clones
# at the pinned ref, so what is audited is verifiable rather than a snapshot someone took.
#
# `expect` is deliberately absent from most entries. Guessing what a real repository ought
# to produce and then tuning until it matches is how a benchmark becomes a mirror. The
# exception is dstack, where an independent audit gives ground truth this project did not
# author.

repos:
  - name: dstack
    url: https://github.com/Dstack-TEE/dstack
    # The exact commit zkSecurity audited, from the report's introduction: "The audit
    # focused on parts of two public codebases: dstack at commit be9d0476, and meta-dstack
    # at commit 5b63aec3." Auditing this pre-fix commit is what makes the comparison
    # meaningful — current main has the fixes applied.
    # resolved from the short form via the GitHub API; committed 2025-05-29,
    # inside the May 26 - June 13 audit window.
    ref: be9d0476a63e937eda4c13659547a25088393394
    platform: dstack
    note: >-
      External validation target. What this re-finds from the zkSecurity report is a
      result; what it misses is a documented gap. Their findings were largely in build
      configuration and OS-image generation, which is adjacent to but not identical to
      this catalog's scope — expect partial overlap at best, and say so.

  - name: meta-dstack
    url: https://github.com/Dstack-TEE/meta-dstack
    # The second repository zkSecurity audited, at the commit their report names
    # ("meta-dstack at commit 5b63aec3"), resolved via the GitHub API; committed
    # 2025-05-29, inside the audit window.
    ref: 5b63aec337f19a541798970c7cf8d846171f0ca9
    platform: dstack
    note: >-
      Five of the fourteen zkSecurity findings live here rather than in dstack, including
      the only High (OVMF built with Config-A, leaving the VMM inside the TCB). The catalog
      has no rules for OS image or firmware build configuration, so the expected result is
      that this repository is largely unreachable — auditing it makes that gap measurable
      instead of assumed.

  - name: aws-nitro-enclaves-samples
    url: https://github.com/aws-samples/aws-nitro-enclaves-workshop
    ref: main
    platform: nitro
    note: >-
      AWS's own sample code. Findings here are worth reading twice: sample code trades
      completeness for clarity, so an omitted safeguard may be pedagogical rather than a
      defect. Useful precisely because it is the code people copy.

  - name: aws-nitro-enclaves-sdk-c
    url: https://github.com/aws/aws-nitro-enclaves-sdk-c
    ref: main
    platform: nitro
    note: >-
      Reference implementation of the KMS attestation flow. A well-maintained repository
      that should be close to clean — any finding is either a real issue or a false
      positive, and both are informative.

  - name: attestation-doc-validation
    url: https://github.com/evervault/attestation-doc-validation
    ref: main
    platform: nitro
    note: >-
      A correct attestation validator. BT-T06 must NOT fire here; if it does, the
      chain-walk detection is wrong. This is the negative control for the rule most likely
      to over-report.

  # --- EigenCompute -------------------------------------------------------------
  # Six deployed applications, pinned at the commit audited. They are the author's own
  # repositories, which is worth stating plainly: it makes the corpus easy to assemble and
  # it means findings here were not adversarially selected. What it does not do is make them
  # softer — the EC01 finding on bobIsAlive was verified against source before it was
  # written down, and vanta is in the corpus precisely because it is the strongest of the six.

  - name: vanta
    url: https://github.com/owizdom/vanta
    ref: e8d274f6052614581b6c7504667b707f9bf95d00
    platform: eigencompute
    note: >-
      The EigenCompute negative control, and the only one of the six on mainnet (Base and
      Polygon). It TLS-SPKI-pins its price feed, reads the mnemonic exactly once and zeroes
      it, rejects HKDF salt/info reuse, keeps the signer as a non-exported KeyObject, and
      refuses to start on an app-id mismatch. EC01, EC02, EC03 and CS01 firing here means
      the detector is wrong, not the repository.

  - name: bobIsAlive
    url: https://github.com/owizdom/bobIsAlive
    ref: 7de5b965e95a022de89799e1c1ac3251ec2d3999
    platform: eigencompute
    note: >-
      Ground truth for BT-EC01. deriveTEEWalletKey derives a Starknet signing key by HMAC
      from kmsPublicKey, which in fallback mode is the literal string
      "eigencompute-instance:${EIGENCOMPUTE_INSTANCE_ID}" — and the instance id is published
      unauthenticated on /api/tee. Verified against source, not inferred. Starknet Sepolia,
      so the funds at risk are testnet.

  - name: eigenbox
    url: https://github.com/owizdom/eigenbox
    ref: cefb8782a1fcb9767c979e26f5d3f1de6d232bea
    platform: eigencompute
    note: >-
      A TEE-side gateway that signs every response with a secp256k1 key. Reports zero
      findings, which is the correct result and also the interesting one: the catalog has no
      rule for "this attests nothing" — the signature is real, and what it proves is only
      that whoever holds the key signed it. That gap is a rule this catalog does not have
      rather than a clean bill of health.

  - name: swarm-mindv2
    url: https://github.com/owizdom/swarm-mindv2
    ref: 709241b0f721eadc413e5268ae138870192456fe
    platform: eigencompute
    note: >-
      The clearest CS01 case in the corpus: decodeJWTPayload is documented in its own
      docstring as decoding "without verifying", and the deploy scripts pass the deployer
      key as an argv flag with --log-visibility public.

  - name: eigen-hotcold-lotto
    url: https://github.com/owizdom/eigen-hotcold-lotto
    ref: e87da7bbdaa6db2c475e592a4361789edcc2dd41
    platform: eigencompute
    note: >-
      Carries the EC03 shape the rule was written for: SEAL_KEY defaulting to 64 zeroes.
      Also holds a defect this catalog cannot see — the enclave returns the exact numeric
      distance to a sealed secret, so two guesses determine it. Information disclosure
      through an intended API is not a pattern, and the gap is worth recording.

  - name: eigencompute-secure-DB
    url: https://github.com/owizdom/eigencompute-secure-DB
    ref: 95e8bf34c9d1301bd554e73dc50d6596ee91af34
    platform: eigencompute
    note: >-
      Smallest of the six and mostly quiet. Included for the T07C case: an API key compared
      with Python's == against an allowlist re-read from disk on every request.
