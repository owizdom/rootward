name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  core:
    name: rust core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - name: test
        working-directory: core
        run: cargo test --locked

      # The differential test is the reason the local PCR implementation is trustworthy:
      # it asserts our measurements match the official aws-nitro-enclaves-image-format
      # crate. That crate pulls ~545 transitive dependencies including openssl, which is
      # why it is optional and why this is a separate job step rather than the default.
      - name: differential check against the official AWS implementation
        working-directory: core
        run: cargo test --features differential measurements_match

      - name: clippy
        working-directory: core
        run: cargo clippy --all-targets -- -D warnings

  catalog:
    name: catalog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv venv && uv pip install pyyaml jsonschema

      # Fails on a rule with no source citation, no stated false-positive mode, a filename
      # that disagrees with its id, or a duplicate id.
      - name: validate rule catalog
        run: .venv/bin/python catalog/validate.py

      # Reports what is catalogued vs implemented, and fails on a detector referencing a
      # catalog id that does not exist, which would emit a finding no rule explains.
      - name: coverage
        run: .venv/bin/python catalog/coverage.py

      # The README's rule table was maintained by hand and drifted: it claimed 42 rules
      # when there were 46, and BT-CS04 shipped without ever appearing in it. It is
      # generated now, and this is what keeps it generated.
      - name: readme rule table is current
        run: |
          .venv/bin/python catalog/table.py > /tmp/table.md
          .venv/bin/python - <<'PY'
          import pathlib, sys
          table = pathlib.Path("/tmp/table.md").read_text().strip()
          readme = pathlib.Path("README.md").read_text()
          if table not in readme:
              print("README.md rule table is stale. Regenerate it with:")
              print("  .venv/bin/python catalog/table.py")
              sys.exit(1)
          print("README rule table matches the catalog")
          PY

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv venv && uv pip install ruff

      # The ruff config had been in pyproject since the start and had never run. It found
      # 58 violations on first execution, including a closure over a loop variable and two
      # zips that would silently truncate.
      - name: ruff
        run: .venv/bin/ruff check .

      # The semantic layer's only enforced boundary. Pure function, no SDK needed.
      - name: audit-root sandbox
        run: .venv/bin/python agent/test_sandbox.py

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: cargo fmt
        working-directory: core
        run: cargo fmt --check

  detect:
    name: detection gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - uses: astral-sh/setup-uv@v5

      - name: build core
        working-directory: core
        run: cargo build --release --bins

      - run: uv venv && uv pip install pyyaml jsonschema semgrep

      - name: semgrep ruleset is valid
        run: .venv/bin/semgrep --validate --config detectors/semgrep/tee/

      - name: build binary fixtures
        run: .venv/bin/python bench/fixtures/build.py

      # Recall on the vulnerable trees, and (the number that matters) zero findings on
      # the clean trees. Three rules have already shipped-and-been-caught firing on
      # correct code; this is what keeps that from recurring.
      - name: fixture regression
        env:
          PATH: ${{ github.workspace }}/.venv/bin:/usr/local/bin:/usr/bin:/bin
        run: .venv/bin/python bench/test_fixtures.py

      # Injects one catalogued defect at a time into a clean tree and asserts that rule
      # fires. Ground truth is exact by construction, so recall is measured not estimated.
      - name: mutation benchmark
        env:
          PATH: ${{ github.workspace }}/.venv/bin:/usr/local/bin:/usr/bin:/bin
        run: .venv/bin/python bench/mutate.py

  # The Action is a published interface. If nobody runs it, it breaks silently and the
  # first person to find out is a stranger who added it to their pipeline.
  action:
    name: action + exit contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - uses: astral-sh/setup-uv@v5

      - name: build core
        working-directory: core
        run: cargo build --release --bins

      - run: uv venv && uv pip install pyyaml jsonschema semgrep reportlab

      - name: build binary fixtures
        run: .venv/bin/python bench/fixtures/build.py

      # PDF is a published output format, so it gets the same treatment as the Action: if
      # nobody runs it, it breaks quietly and a stranger finds out.
      - name: pdf output renders
        env:
          PATH: ${{ github.workspace }}/.venv/bin:/usr/local/bin:/usr/bin:/bin
        run: |
          .venv/bin/python cli/audit.py bench/fixtures/eigencompute-vulnerable \
            --format pdf --out /tmp/report.pdf
          [ -s /tmp/report.pdf ] || { echo "no pdf written"; exit 1; }
          head -c 5 /tmp/report.pdf | grep -q '%PDF-' || { echo "not a pdf"; exit 1; }
          echo "pdf ok: $(wc -c < /tmp/report.pdf) bytes"

      # The exit contract is what every CI gate built on this tool depends on, so it is
      # asserted rather than assumed: 2 means findings, 0 means clean, 1 means the audit
      # could not run and must never read as a pass.
      - name: exit 2 on a repo with findings
        env:
          PATH: ${{ github.workspace }}/.venv/bin:/usr/local/bin:/usr/bin:/bin
        run: |
          set +e
          .venv/bin/python cli/audit.py bench/fixtures/eigencompute-vulnerable \
            --fail-on high > /dev/null
          code=$?
          [ "$code" = "2" ] || { echo "expected exit 2, got $code"; exit 1; }

      - name: exit 0 on a clean repo
        env:
          PATH: ${{ github.workspace }}/.venv/bin:/usr/local/bin:/usr/bin:/bin
        run: |
          set +e
          .venv/bin/python cli/audit.py bench/fixtures/eigencompute-clean \
            --fail-on high > /dev/null
          code=$?
          [ "$code" = "0" ] || { echo "expected exit 0, got $code"; exit 1; }

      - name: exit 1 when the audit cannot run
        run: |
          set +e
          .venv/bin/python cli/audit.py /does/not/exist --fail-on high > /dev/null 2>&1
          code=$?
          [ "$code" = "1" ] || { echo "expected exit 1, got $code"; exit 1; }

      - name: SARIF validates against the 2.1.0 schema
        env:
          PATH: ${{ github.workspace }}/.venv/bin:/usr/local/bin:/usr/bin:/bin
        run: |
          .venv/bin/python cli/audit.py bench/fixtures/eigencompute-vulnerable \
            --format sarif > /tmp/out.sarif
          curl -sSL -o /tmp/sarif-schema.json https://json.schemastore.org/sarif-2.1.0.json
          .venv/bin/python - <<'PY'
          import json, jsonschema
          schema = json.load(open("/tmp/sarif-schema.json"))
          doc = json.load(open("/tmp/out.sarif"))
          errs = list(jsonschema.Draft7Validator(schema).iter_errors(doc))
          if errs:
              for e in errs[:5]:
                  print(list(e.path), "->", e.message[:200])
              raise SystemExit(1)
          print(f"SARIF ok: {len(doc['runs'][0]['results'])} results")
          PY

      # Dogfood: the tool audits its own fixture tree through the published Action.
      - name: the Action itself runs
        uses: ./
        with:
          path: bench/fixtures/eigencompute-clean
          fail-on: high
          sarif-file: ""
