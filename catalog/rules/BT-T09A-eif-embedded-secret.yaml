id: BT-T09A-eif-embedded-secret
title: Secret material recoverable from the built EIF ramdisk
source: https://bluethroatlabs.com/docs/dumb-ways-to-get-rekt-with-tees
threat: 9
layer_required: 1
platform: [nitro]
severity: critical
detection: deterministic
detector: core:eif-secret-scan
languages: [any]
rationale: >
  An EIF is a build artifact sitting on the parent's filesystem, and the parent is hostile. Anyone
  with EC2 access can copy it, decompress the CPIO ramdisk, and grep the resulting filesystem. A
  key baked in at build time via a Dockerfile ENV, a committed config file, or a vendored keystore
  is therefore not protected by the enclave at all: it never had to be extracted from memory,
  because it was on disk the whole time.
attack: >
  Handbook cites the Ronin Bridge compromise (roughly 625 million USD, March 2022) to illustrate
  the consequence of validator key compromise, while noting that incident did not itself involve
  TEEs.
remediation: >
  Never bake secrets into the image. Provision them at runtime after attestation succeeds, via KMS
  Decrypt gated on a RecipientAttestation condition or an equivalent policy-gated release, so that
  possession of the image confers nothing.
false_positives: >
  Test keys, well-known development keypairs, and public-key material will match the same patterns
  as live secrets. An allowlist of known test vectors is applied, and entropy scoring reduces but
  does not eliminate this. Any hit still needs a human to decide whether the key is live.
confidence: high
status: implemented
