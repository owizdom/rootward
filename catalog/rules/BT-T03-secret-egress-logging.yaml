id: BT-T03-secret-egress-logging
title: Decrypted data or key material reaches a log sink outside the enclave
source: https://bluethroatlabs.com/docs/dumb-ways-to-get-rekt-with-tees
threat: 3
layer_required: 1
platform: [nitro, dstack, generic]
severity: critical
detection: hybrid
detector: semgrep:tee/secret-to-log-sink
languages: [rust, go, python, typescript]
rationale: >
  Anything written to stdout, stderr, or a logging SDK inside an enclave leaves the trust boundary
  and lands somewhere the operator can read, typically CloudWatch. Plaintext, key material, and
  error strings that embed either are effectively public the moment they are logged. This is the
  cheapest of all the threats to exploit because it requires no attack at all, only log access.
remediation: >
  Log hashed or truncated identifiers only. Where a secret-derived value must be correlated across
  systems, log a keyed hash of it. Route any genuinely sensitive diagnostic to an in-enclave
  buffer that is never flushed to the parent.
false_positives: >
  Taint tracking cannot distinguish a decrypted payload from its length, its hash, or a redacted
  view of it. Codebases that pass a wrapper type through a redacting formatter will be flagged
  unless the redactor is recognised, so expect over-reporting wherever a custom Display or
  Serialize implementation performs the redaction.
confidence: medium
status: draft
