id: BT-EC05-deploy-secret-in-argv
title: Deploy secret passed as a command-line argument
source: https://bluethroatlabs.com/docs/dumb-ways-to-get-rekt-with-tees
source_secondary:
  - https://github.com/Layr-Labs/eigenx-cli
threat: 3
layer_required: 1
platform: [eigencompute]
severity: high
detection: deterministic
detector: detectors:eigencompute.check_secret_in_argv
languages: [shell, yaml]
rationale: >
  Argument vectors are not private. Any process on the host can read them from ps or /proc,
  they are written to shell history, and CI systems echo command lines into build logs that
  are frequently world-readable. Passing --private-key to the ecloud CLI therefore publishes
  the key that controls the app's deployments to three audiences at once, none of them
  intended. The CLI reads the same value from the environment, which none of those capture.
remediation: >
  Export the value as an environment variable - ECLOUD_PRIVATE_KEY - and let the CLI read it,
  or supply it through the CI system's secret store. Keep it out of the command line and out
  of any file that is committed.
false_positives: >
  A documentation snippet illustrating a flag, or a placeholder in a template, will match
  while containing no real secret. The rule requires an argument value rather than a bare
  flag, which removes usage strings, but examples in a README are a known and deliberate hit
  because they are copied verbatim into real scripts.
confidence: high
status: implemented
