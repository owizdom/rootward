id: BT-T09B-dockerfile-secret
title: Secret introduced through Dockerfile ENV, ARG, or copied build context
source: https://bluethroatlabs.com/docs/dumb-ways-to-get-rekt-with-tees
threat: 9
layer_required: 1
platform: [nitro, dstack]
severity: critical
detection: deterministic
detector: detectors:buildconfig.dockerfile_secrets
languages: [dockerfile, shell]
rationale: >
  The upstream cause of BT-T09A, caught earlier and more cheaply. A build ARG persists in image
  history, an ENV persists in the running filesystem, and a COPY of a .env or keystore directory
  puts the secret in the ramdisk verbatim. Catching it at the Dockerfile means catching it before
  an image is ever built.
remediation: >
  Pass secrets at runtime only. Use BuildKit secret mounts if a credential is genuinely needed
  during build, and add .env, key material, and keystore paths to .dockerignore.
false_positives: >
  Placeholder values, empty defaults, and variables named like secrets that hold non-secret
  configuration all match. Value-shape checks and entropy filtering are applied before reporting.
confidence: high
status: benchmarked
