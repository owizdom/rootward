# BT-T07C: non-constant-time comparison of a secret-derived value.
#
# The highest-precision rule in the catalog, and deliberately tuned toward recall: a
# constant-time comparison of a public value costs nothing, so a false positive here is
# cheap. Missing one is not, byte-comparison short-circuits on first mismatch, which turns
# an exponential brute force into a linear one at ~256 queries per byte, and the parent
# instance sits close enough to the enclave to measure the difference cleanly.

rules:
  - id: tee-timing-oracle-compare-rust
    languages: [rust]
    severity: WARNING
    message: >-
      Non-constant-time comparison on a secret-derived value ($LHS). Comparison
      short-circuits on the first differing byte, so response latency leaks how many
      leading bytes matched and the value can be recovered byte by byte from the parent
      instance. Use subtle::ConstantTimeEq.
    metadata:
      catalog-id: BT-T07C-timing-oracle-compare
      threat: 7
      layer_required: 3
      confidence: HIGH
      references:
        - https://cwe.mitre.org/data/definitions/208.html
        - https://docs.rs/subtle
    patterns:
      - pattern-either:
          - pattern: $LHS == $RHS
          - pattern: $LHS != $RHS
          - pattern: $LHS.eq(&$RHS)
          - pattern: $LHS.as_slice() == $RHS.as_slice()
      - metavariable-regex:
          metavariable: $LHS
          regex: (?i).*(secret|hmac|signature|sig(nature)?([^a-z]|$)|mac|auth_?tag|mac_?tag|gcm_?tag|token|passwd|password|auth_?code|api_?key|private_?key|shared_?key|session_?key).*
      # A length check is not the leaky comparison; it leaks only the length.
      - pattern-not: $LHS.len() == $RHS
      - pattern-not: $LHS.len() != $RHS
      # Do not flag the recommended fix. Comparing the *result* of a constant-time
      # primitive is how those APIs are used, and the operand name still matches the
      # secret-ish regex, so without this the rule fires hardest on correct code.
      - pattern-not: $A.ct_eq($B) == $R
      - pattern-not: $A.ct_eq($B) != $R
      # A length comparison leaks only the length, not the value.
      - metavariable-regex:
          metavariable: $LHS
          regex: ^(?!.*\.len\(\)$)(?!.*\.length$).*
      # Comparing a *digest* of the secret against a stored expected digest leaks only the
      # digest, and the expected value is already known to whoever holds the config. dstack
      # checks `launch_token_hash(token) != expected` and its own error string says "use a
      # random token since launch_token_hash is public"; a timing channel there hands an
      # attacker something they can compute offline. Forging still needs a preimage.
      - metavariable-regex:
          metavariable: $LHS
          regex: (?i)^(?!.*\b\w*_?(hash|digest)\b).*$
      # Comparing against an enum variant, a SCREAMING_CASE constant, a string or byte
      # literal, an array literal, or a number is a format or magic-value check, never a
      # secret comparison. dstack supplied one of each: `!= Digest::SHA384`,
      # `!= pe::IMAGE_NT_SIGNATURE`, `!= b"TDVF"`, `!= [0u8; 48]`, `.len() != 96`.
      - metavariable-regex:
          metavariable: $RHS
          regex: ^(?!\w+::[A-Z][A-Z0-9_]+)(?!\w+\.[A-Z][A-Z0-9_]+$)(?![A-Z][A-Za-z0-9]*::)(?![A-Z][A-Z0-9_]{2,}$)(?!Some\()(?!b?["'])(?!\[)(?!\d)(?!null$)(?!undefined$)(?!None$)(?!nil$).*

  - id: tee-timing-oracle-compare-go
    languages: [go]
    severity: WARNING
    message: >-
      Non-constant-time comparison on a secret-derived value ($LHS). Use
      crypto/subtle.ConstantTimeCompare; bytes.Equal and == both short-circuit and leak
      the length of the matching prefix through timing.
    metadata:
      catalog-id: BT-T07C-timing-oracle-compare
      threat: 7
      layer_required: 3
      confidence: HIGH
    patterns:
      - pattern-either:
          - pattern: $LHS == $RHS
          - pattern: $LHS != $RHS
          - pattern: bytes.Equal($LHS, $RHS)
          - pattern: strings.EqualFold($LHS, $RHS)
      - metavariable-regex:
          metavariable: $LHS
          regex: (?i).*(secret|hmac|signature|sig(nature)?([^a-z]|$)|mac|auth_?tag|mac_?tag|gcm_?tag|token|passwd|password|authCode|apiKey|privateKey|sharedKey|sessionKey).*
      - pattern-not: len($LHS) == $RHS
      - pattern-not: len($LHS) != $RHS
      # subtle.ConstantTimeCompare(...) == 1 and hmac.Equal(...) are the recommended
      # fixes; flagging them would penalise correct code.
      - pattern-not: subtle.ConstantTimeCompare(...) == $R
      # A length comparison leaks only the length, not the value.
      - metavariable-regex:
          metavariable: $LHS
          regex: ^(?!.*\.len\(\)$)(?!.*\.length$).*
      # Comparing a *digest* of the secret against a stored expected digest leaks only the
      # digest, and the expected value is already known to whoever holds the config. dstack
      # checks `launch_token_hash(token) != expected` and its own error string says "use a
      # random token since launch_token_hash is public"; a timing channel there hands an
      # attacker something they can compute offline. Forging still needs a preimage.
      - metavariable-regex:
          metavariable: $LHS
          regex: (?i)^(?!.*\b\w*_?(hash|digest)\b).*$
      # Comparing against an enum variant, a SCREAMING_CASE constant, a string or byte
      # literal, an array literal, or a number is a format or magic-value check, never a
      # secret comparison. dstack supplied one of each: `!= Digest::SHA384`,
      # `!= pe::IMAGE_NT_SIGNATURE`, `!= b"TDVF"`, `!= [0u8; 48]`, `.len() != 96`.
      - metavariable-regex:
          metavariable: $RHS
          regex: ^(?!\w+::[A-Z][A-Z0-9_]+)(?!\w+\.[A-Z][A-Z0-9_]+$)(?![A-Z][A-Za-z0-9]*::)(?![A-Z][A-Z0-9_]{2,}$)(?!Some\()(?!b?["'])(?!\[)(?!\d)(?!null$)(?!undefined$)(?!None$)(?!nil$).*
      - pattern-not: subtle.ConstantTimeCompare(...) != $R
      - pattern-not: hmac.Equal(...) == $R

  - id: tee-timing-oracle-compare-python
    languages: [python]
    severity: WARNING
    message: >-
      Non-constant-time comparison on a secret-derived value ($LHS). Use
      hmac.compare_digest; == on bytes or str short-circuits and leaks the matching prefix
      length through response timing.
    metadata:
      catalog-id: BT-T07C-timing-oracle-compare
      threat: 7
      layer_required: 3
      confidence: HIGH
    patterns:
      - pattern-either:
          - pattern: $LHS == $RHS
          - pattern: $LHS != $RHS
      - metavariable-regex:
          metavariable: $LHS
          regex: (?i).*(secret|hmac|signature|sig(nature)?([^a-z]|$)|mac|auth_?tag|mac_?tag|gcm_?tag|token|passwd|password|auth_code|api_key|private_key|shared_key|session_key).*
      - pattern-not-inside: |
          def $F(...):
            ...
            assert ...
      - pattern-not: len($LHS) == $RHS
      - pattern-not: len($LHS) != $RHS
      - pattern-not: hmac.compare_digest(...) == $R
      # A length comparison leaks only the length, not the value.
      - metavariable-regex:
          metavariable: $LHS
          regex: ^(?!.*\.len\(\)$)(?!.*\.length$).*
      # Comparing a *digest* of the secret against a stored expected digest leaks only the
      # digest, and the expected value is already known to whoever holds the config. dstack
      # checks `launch_token_hash(token) != expected` and its own error string says "use a
      # random token since launch_token_hash is public"; a timing channel there hands an
      # attacker something they can compute offline. Forging still needs a preimage.
      - metavariable-regex:
          metavariable: $LHS
          regex: (?i)^(?!.*\b\w*_?(hash|digest)\b).*$
      # Comparing against an enum variant, a SCREAMING_CASE constant, a string or byte
      # literal, an array literal, or a number is a format or magic-value check, never a
      # secret comparison. dstack supplied one of each: `!= Digest::SHA384`,
      # `!= pe::IMAGE_NT_SIGNATURE`, `!= b"TDVF"`, `!= [0u8; 48]`, `.len() != 96`.
      - metavariable-regex:
          metavariable: $RHS
          regex: ^(?!\w+::[A-Z][A-Z0-9_]+)(?!\w+\.[A-Z][A-Z0-9_]+$)(?![A-Z][A-Za-z0-9]*::)(?![A-Z][A-Z0-9_]{2,}$)(?!Some\()(?!b?["'])(?!\[)(?!\d)(?!null$)(?!undefined$)(?!None$)(?!nil$).*
      - pattern-not: secrets.compare_digest(...) == $R

  - id: tee-timing-oracle-compare-js
    languages: [javascript, typescript]
    severity: WARNING
    message: >-
      Non-constant-time comparison on a secret-derived value ($LHS). Use
      crypto.timingSafeEqual; === on strings or Buffers short-circuits and leaks the
      matching prefix length through response timing.
    metadata:
      catalog-id: BT-T07C-timing-oracle-compare
      threat: 7
      layer_required: 3
      confidence: HIGH
    patterns:
      - pattern-either:
          - pattern: $LHS === $RHS
          - pattern: $LHS !== $RHS
          - pattern: $LHS == $RHS
          - pattern: $LHS.equals($RHS)
      - metavariable-regex:
          metavariable: $LHS
          regex: (?i).*(secret|hmac|signature|sig(nature)?([^a-z]|$)|mac|auth_?tag|mac_?tag|gcm_?tag|token|passwd|password|authCode|apiKey|privateKey|sharedKey|sessionKey).*
      - pattern-not: $LHS.length === $RHS
      - pattern-not: $LHS.length !== $RHS
      - pattern-not: crypto.timingSafeEqual(...) === $R
      # A length comparison leaks only the length, not the value.
      - metavariable-regex:
          metavariable: $LHS
          regex: ^(?!.*\.len\(\)$)(?!.*\.length$).*
      # Comparing a *digest* of the secret against a stored expected digest leaks only the
      # digest, and the expected value is already known to whoever holds the config. dstack
      # checks `launch_token_hash(token) != expected` and its own error string says "use a
      # random token since launch_token_hash is public"; a timing channel there hands an
      # attacker something they can compute offline. Forging still needs a preimage.
      - metavariable-regex:
          metavariable: $LHS
          regex: (?i)^(?!.*\b\w*_?(hash|digest)\b).*$
      # Comparing against an enum variant, a SCREAMING_CASE constant, a string or byte
      # literal, an array literal, or a number is a format or magic-value check, never a
      # secret comparison. dstack supplied one of each: `!= Digest::SHA384`,
      # `!= pe::IMAGE_NT_SIGNATURE`, `!= b"TDVF"`, `!= [0u8; 48]`, `.len() != 96`.
      - metavariable-regex:
          metavariable: $RHS
          regex: ^(?!\w+::[A-Z][A-Z0-9_]+)(?!\w+\.[A-Z][A-Z0-9_]+$)(?![A-Z][A-Za-z0-9]*::)(?![A-Z][A-Z0-9_]{2,}$)(?!Some\()(?!b?["'])(?!\[)(?!\d)(?!null$)(?!undefined$)(?!None$)(?!nil$).*
      - pattern-not: crypto.timingSafeEqual(...) == $R
